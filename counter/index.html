<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카운터</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main class="counter">
    <h1 class="title">카운터</h1>

    <!-- 현재 숫자 표시 (값이 바뀌면 스크린 리더가 읽어 줌) -->
    <output id="count" class="count" aria-live="polite">0</output>

    <!-- 증가 / 감소 버튼 -->
    <div class="controls">
      <button type="button" id="decrease" class="btn btn-step" aria-label="1 감소">−</button>
      <button type="button" id="increase" class="btn btn-step" aria-label="1 증가">+</button>
    </div>

    <!-- 리셋 버튼 -->
    <button type="button" id="reset" class="btn btn-reset">리셋</button>
  </main>
</body>
</html>
