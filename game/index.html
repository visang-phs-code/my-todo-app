<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스네이크 게임</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <main class="game">
        <h1>🐍 스네이크 게임</h1>

        <div class="scoreboard">
            <div class="score-box">
                <span class="label">점수</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="score-box">
                <span class="label">최고 점수</span>
                <span id="best-score" class="value">0</span>
            </div>
            <div class="score-box">
                <span class="label">레벨</span>
                <span id="level" class="value">1</span>
            </div>
        </div>

        <div class="controls">
            <label>
                난이도
                <select id="difficulty">
                    <option value="200">쉬움</option>
                    <option value="150" selected>보통</option>
                    <option value="100">어려움</option>
                    <option value="50">매우 어려움</option>
                </select>
            </label>
            <button id="pause-btn" type="button" disabled>일시정지</button>
        </div>

        <div class="board">
            <canvas id="canvas" width="400" height="400"></canvas>

            <div id="start-screen" class="overlay">
                <p>방향키로 뱀을 조종하세요</p>
                <button id="start-btn" type="button">게임 시작</button>
            </div>

            <div id="pause-screen" class="overlay paused hidden">
                <h2>일시정지</h2>
            </div>

            <div id="gameover-screen" class="overlay hidden">
                <h2>게임 오버</h2>
                <p>점수: <strong id="final-score">0</strong></p>
                <button id="restart-btn" type="button">다시 시작</button>
            </div>
        </div>
    </main>
</body>
</html>
