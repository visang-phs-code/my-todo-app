<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 할 일 목록</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <main class="card">
        <h1 class="title">나의 할 일 목록</h1>

        <form class="todo-form">
            <input type="text" class="todo-input" placeholder="할 일을 입력하세요" aria-label="할 일">
            <button type="submit" class="add-button">추가</button>
        </form>

        <p class="todo-count">전체 <strong class="total-count">0</strong>개, 완료 <strong class="done-count">0</strong>개</p>

        <div class="toolbar">
            <div class="filters">
                <button type="button" class="filter-button active" data-filter="all">전체</button>
                <button type="button" class="filter-button" data-filter="active">진행중</button>
                <button type="button" class="filter-button" data-filter="completed">완료</button>
            </div>
            <button type="button" class="clear-button">완료된 항목 삭제</button>
        </div>

        <ul class="todo-list"></ul>
    </main>
</body>
</html>
